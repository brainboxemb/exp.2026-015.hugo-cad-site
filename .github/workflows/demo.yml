name: Hextra end-to-end proof

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hextra-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4

      - name: Checkout pinned CAD source
        uses: actions/checkout@v4
        with:
          repository: brainboxemb/2026-011-02.cad.solidcraft
          ref: b627544423523ce54d2366ad4ae52d233532c54a
          path: sources/cad
          fetch-depth: 1

      - name: Checkout pinned CAD build scope
        uses: actions/checkout@v4
        with:
          repository: brainboxemb/2026-011-02.cad.solidcraft
          ref: b00fa56ac62eb34ed405f87a2a4f2dc3efa3d23f
          path: sources/cad-build
          fetch-depth: 1

      - name: Checkout pinned Forge source
        uses: actions/checkout@v4
        with:
          repository: brainboxemb/lib.py.solidcraft.forge
          ref: 156a4bfd316dbe711932f58990328e5711385751
          path: sources/forge
          fetch-depth: 1

      - name: Checkout pinned Notes image cache
        uses: actions/checkout@v4
        with:
          repository: brainboxemb/notes
          ref: e56a0ab01ad9031578d0f3c158309ea2606cd81e
          path: sources/notes
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Set up Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.169.0"
          extended: true

      - name: Verify pinned Hextra module
        run: |
          graph="$(hugo mod graph)"
          printf '%s\n' "$graph"
          grep -F "github.com/imfing/hextra@v0.13.0" <<<"$graph"
          ! grep -F "github.com/nunocoracao/blowfish" <<<"$graph"

      - name: Stage Simple MFT layout assets
        run: bash scripts/stage-layout-assets.sh

      - name: Build Hextra proof
        run: hugo --gc --minify --printPathWarnings

      - name: Verify generated Simple MFT page
        run: |
          test -s public/models/simple-mft/index.html
          test -s public/layout-assets/simple-mft/product-reference.webp
          grep -F "cad-model-overview" public/models/simple-mft/index.html
          grep -F "cad-source-section" public/models/simple-mft/index.html
          grep -F "cad-verification-grid" public/models/simple-mft/index.html
          grep -F "cad-collapsible" public/models/simple-mft/index.html
          grep -F "23 commands" public/models/simple-mft/index.html
          grep -F "Reference and 2D expectation" public/models/simple-mft/index.html
          grep -F "Model context" public/models/simple-mft/index.html
          grep -F "<ul>" public/models/simple-mft/index.html
          grep -F "Build and verification" public/models/simple-mft/index.html
          grep -F "expected-top-view" public/models/simple-mft/index.html
          grep -F "The actual SCPF Python source used by this model." public/models/simple-mft/index.html
          ! grep -F "Show source" public/models/simple-mft/index.html

      - name: Capture model layouts in headless Chrome
        run: bash scripts/capture-layout.sh

      - name: Upload visual layout evidence
        uses: actions/upload-artifact@v4
        with:
          name: model-layouts
          path: artifacts/layout
          if-no-files-found: error
          retention-days: 7

      - name: Verify generated proof pages
        run: |
          test -s public/index.html
          test -s public/models/index.html
          test -s public/models/plate/index.html
          test -s public/docs/forge-api/index.html

          grep -F "CAD models and Forge reference" public/index.html
          grep -F "sc-page-shell" public/models/index.html
          grep -F "SolidCraft CAD" public/models/index.html
          grep -F "Explicit world positions keep this compact comparison model simple." public/models/plate/index.html
          grep -F "Model preview" public/models/plate/index.html
          grep -F "Construction stages" public/models/plate/index.html
          grep -F "parameters.add" public/models/plate/index.html
          grep -F "SolidCraft command sequence" public/models/plate/index.html
          grep -F "cad-source-section" public/models/plate/index.html
          grep -F "cad-verification-grid" public/models/plate/index.html
          grep -F "cad-collapsible" public/models/plate/index.html
          grep -F "hextra-code-copy-btn" public/models/plate/index.html
          grep -F "Open in SolidCraft Web" public/models/plate/index.html
          grep -F "docs.solidcraft.io/app/?open=" public/models/plate/index.html
          grep -F "Build and verification" public/models/plate/index.html
          grep -F "The actual SCPF Python source used by this model." public/models/plate/index.html
          ! grep -F "Show source" public/models/plate/index.html
          ! grep -F "sc-section-index" public/models/plate/index.html
          grep -F "Primary cross-object API contract" public/docs/forge-api/index.html
          grep -F "object-first assemblies" public/docs/forge-api/index.html

      - name: Build approval preview for this pull request
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PREVIEW_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/preview/pr-${{ github.event.pull_request.number }}/
        run: |
          rm -rf preview-public
          hugo --gc --minify --printPathWarnings \
            --baseURL "$PREVIEW_BASE" \
            --destination preview-public

      - name: Publish pull-request approval preview
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./preview-public
          destination_dir: preview/pr-${{ github.event.pull_request.number }}
          keep_files: true
          enable_jekyll: false
          commit_message: "site: publish PR ${{ github.event.pull_request.number }} approval preview from ${{ github.sha }}"

      - name: Add approval preview URLs to workflow summary
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/preview/pr-${{ github.event.pull_request.number }}/"
          {
            echo "## Approval preview"
            echo
            echo "Plate: ${base}models/plate/"
            echo
            echo "Simple MFT: ${base}models/simple-mft/"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish exact generated site to gh-pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
          enable_jekyll: false
          commit_message: "site: publish Hextra proof from ${{ github.sha }}"

  stage-preview-pages:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 1

      - name: Verify approval preview content
        run: |
          root="published/preview/pr-${{ github.event.pull_request.number }}"
          test -s "$root/models/plate/index.html"
          test -s "$root/models/simple-mft/index.html"
          grep -F "cad-source-section" "$root/models/plate/index.html"
          grep -F "cad-source-section" "$root/models/simple-mft/index.html"
          grep -F "Reference and 2D expectation" "$root/models/simple-mft/index.html"

      - name: Upload gh-pages branch as Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: published

  stage-pages:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 1

      - name: Verify published branch content
        run: |
          test -s published/index.html
          test -s published/models/plate/index.html
          test -s published/models/simple-mft/index.html
          test -s published/docs/forge-api/index.html
          test -f published/.nojekyll
          grep -F "CAD models and Forge reference" published/index.html
          grep -F "Model preview" published/models/plate/index.html
          grep -F "SolidCraft command sequence" published/models/plate/index.html
          grep -F "cad-source-section" published/models/plate/index.html
          grep -F "cad-verification-grid" published/models/plate/index.html
          grep -F "hextra-code-copy-btn" published/models/plate/index.html
          grep -F "Open in SolidCraft Web" published/models/plate/index.html
          grep -F "Reference and 2D expectation" published/models/simple-mft/index.html
          grep -F "cad-source-section" published/models/simple-mft/index.html
          grep -F "cad-verification-grid" published/models/simple-mft/index.html
          grep -F "Primary cross-object API contract" published/docs/forge-api/index.html

      - name: Upload gh-pages branch as Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: published

  deploy:
    if: github.event_name != 'pull_request'
    needs: stage-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy published branch
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify public Pages routes over HTTPS
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"

          fetch() {
            local path="$1"
            local output="$2"
            for attempt in $(seq 1 20); do
              if curl --fail --silent --show-error --location                 --output "$output" "${base}${path}"; then
                return 0
              fi
              sleep 3
            done
            echo "ERROR: public Pages route did not become reachable: ${base}${path}" >&2
            return 1
          }

          fetch "" /tmp/home.html
          fetch "models/plate/" /tmp/plate.html
          fetch "models/simple-mft/" /tmp/simple-mft.html
          fetch "docs/forge-api/" /tmp/forge-api.html

          grep -F "CAD models and Forge reference" /tmp/home.html
          grep -F "Explicit world positions keep this compact comparison model simple." /tmp/plate.html
          grep -F "Model preview" /tmp/plate.html
          grep -F "Construction stages" /tmp/plate.html
          grep -F "parameters.add" /tmp/plate.html
          grep -F "SolidCraft command sequence" /tmp/plate.html
          grep -F "cad-source-section" /tmp/plate.html
          grep -F "cad-verification-grid" /tmp/plate.html
          grep -F "hextra-code-copy-btn" /tmp/plate.html
          grep -F "Open in SolidCraft Web" /tmp/plate.html
          grep -F "Reference and 2D expectation" /tmp/simple-mft.html
          grep -F "cad-source-section" /tmp/simple-mft.html
          grep -F "cad-verification-grid" /tmp/simple-mft.html
          grep -F "Primary cross-object API contract" /tmp/forge-api.html

          printf 'LIVE_URL=%s\n' "$base"
          printf 'CAD_URL=%smodels/plate/\n' "$base"
          printf 'SIMPLE_MFT_URL=%smodels/simple-mft/\n' "$base"
          printf 'FORGE_URL=%sdocs/forge-api/\n' "$base"
