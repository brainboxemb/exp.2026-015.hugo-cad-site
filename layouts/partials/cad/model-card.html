{{ $m := .Params.model }}
<a class="sc-model-card" href="{{ .RelPermalink }}">
  <div class="sc-model-card-top">
    <span>{{ .Params.cadSection }}</span>
    <span class="sc-model-card-arrow">→</span>
  </div>
  <strong>{{ .Title }}</strong>
  <small>{{ index $m "tagline" }}</small>
  <em>{{ index $m "parameters" }}</em>
</a>
