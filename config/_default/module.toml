[[imports]]
path = "github.com/imfing/hextra"

[[mounts]]
source = "archetypes"
target = "archetypes"

[[mounts]]
source = "assets"
target = "assets"

[[mounts]]
source = "content"
target = "content"

[[mounts]]
source = "data"
target = "data"

[[mounts]]
source = "i18n"
target = "i18n"

[[mounts]]
source = "layouts"
target = "layouts"

[[mounts]]
source = "static"
target = "static"

# Shared model metadata stays data-only.
[[mounts]]
source = "sources/cad/models"
target = "data/cad/models"
files = ["**/model.yml"]

# The actual SCPF source remains owned by the CAD repository.
[[mounts]]
source = "sources/cad/models"
target = "assets/cad-source"
files = ["**/*.py", "**/*.svg", "**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.webp"]

# Accepted durable build evidence is read-only presentation input.
[[mounts]]
source = "sources/cad-build/main"
target = "assets/cad-build"
files = ["**/*.json", "**/*.png", "**/*.sc", "**/*.step"]

# The Forge API page renders the exact Markdown owned by Forge.
[[mounts]]
source = "sources/forge/docs"
target = "assets/forge-docs"
files = ["api.md"]
