[[imports]]
path = "github.com/nunocoracao/blowfish/v3"

# Defining project mounts replaces Hugo's defaults, so retain the standard
# project components explicitly and add the CAD repository only as data.
[[mounts]]
source = "archetypes"
target = "archetypes"

[[mounts]]
source = "assets"
target = "assets"

[[mounts]]
source = "content"
target = "content"

[[mounts]]
source = "data"
target = "data"

[[mounts]]
source = "i18n"
target = "i18n"

[[mounts]]
source = "layouts"
target = "layouts"

[[mounts]]
source = "static"
target = "static"

[[mounts]]
source = "sources/cad/models"
target = "data/cad/models"
# Hugo data mounts may contain only supported data formats. Restrict the
# external CAD tree to the model-owned metadata files; Python/model source
# remains in the CAD repository and is linked by metadata, not parsed as data.
files = ["**/model.yml"]
